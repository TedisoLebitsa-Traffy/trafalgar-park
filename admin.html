<!-- ADMIN PAGE: host only. Contains every answer. NEVER capture this window in TikTok LIVE Studio. -->
<header id="top">
  <div class="brand">Trafalgar Park <small>ADMIN · HOST ONLY</small></div>
  <div id="conn" class="bad">● No screen connected</div>
  <button id="aPair">📲 Connect a screen</button>
  <button id="aGear">⚙</button>
  <nav>
    <button data-nav="hub">🏠 Hub</button>
    <button data-nav="intro">Intro</button>
  </nav>
  <div class="tools">
    <button id="aMute">🔊 Sound</button>
    <button id="aAdapt">⤢ Adapt to screen</button>
    <button id="aHide">🙈 Hide display buttons</button>
    <button id="aFull">⛶ Fullscreen</button>
    <button id="aHelp">? Shortcuts</button>
  </div>
</header>
<main>
  <div id="left">
    <div id="prevwrap"><iframe id="prev" title="Live preview of the display page"></iframe></div>
    <div class="phint">Live preview of what the audience sees. On a PC the real screen is <b>index.html</b> in its own window; on phones use <b>Connect a screen</b>.</div>
  </div>
  <div id="host"></div>
</main>
<nav id="tabbar"><button id="tabHost" class="on">🎛 Host</button><button id="tabScreen">📺 Screen</button></nav>
<div id="toastA"></div>
<div class="modal" id="resume"><div class="panel"><h2>👋 Welcome back</h2><div class="finalsc" id="resumeInfo" style="font-size:1.3em"></div>
  <div class="ctrls"><button class="btn green" id="resumeYes">▶ Resume game</button><button class="btn ghost" id="resumeNo">Start fresh</button></div></div></div>
